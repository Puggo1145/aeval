name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      package_set:
        description: Packages to publish
        required: true
        default: core-graders
        type: choice
        options:
          - core-graders
          - all

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Select publish command
        id: publish-command
        run: |
          if [ "${{ inputs.package_set }}" = "all" ]; then
            echo "command=pnpm publish:npm" >> "$GITHUB_OUTPUT"
          else
            echo "command=pnpm publish:npm:core-graders" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish selected packages
        run: ${{ steps.publish-command.outputs.command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
