schemaVersion: "task.v1"
id: "youapi-agent/task-002-board-search-grounded-summary"
desc: "A more realistic read-only eval for the internal youapi agent endpoint. The agent should inspect the current board and return a grounded two-part summary based on the observed board state. Replace the UUIDs with a valid whitelisted test user context before running."
category: "youapi-agent"
capability: "board-search-grounded-summary"
tier: "L1"
difficulty: "medium"
tags: ["read-only", "board", "board-search", "tool-calls", "llm-judge"]

provider:
  id: "youapi-agent"
  runs:
    - name: "agent-grounded-board-search-summary"
      params:
        userId: "6850dead-afa7-41f7-9e1a-91645e0249db"
        spaceId: "019cc16e-48df-73a6-87ad-6e597c86d366"
        boardId: "019cc16f-425a-7d36-a248-afa397d5edc9"
        prompt: |-
          First inspect the current board structure and its visible contents.

          Reply with exactly two short sections:
          Board status: one grounded sentence summarizing what is currently on the board.
          Board follow-up: one grounded sentence stating a concrete next step based on what is or is not currently on the board.

          Do not create, edit, or save any content.
        messageMode: "agent"

graders:
  strategy: "WEIGHTED"
  passThreshold: 0.85
  layers:
    - name: "response should not be empty"
      type: "length-check"
      weight: 0.1
      config:
        min: 40

    - name: "must inspect the board without mutating content"
      type: "tool-calls"
      weight: 0.35
      config:
        required:
          - tool: "list_board"
        forbidden:
          - tool: "write"
          - tool: "edit"
          - tool: "save_materials"
          - tool: "create_board"
        minCalls: 1
        maxCalls: 4

    - name: "final answer should be grounded in board inspection"
      type: "llm-judge"
      weight: 0.55
      config:
        dimension: "grounded task completion"
        rubric: "Pass only if the final answer accurately summarizes the current board based on the observed board structure and contents, provides a sensible next step grounded in that state, and stays strictly read-only."
        assertions:
          - "The answer includes a board-status summary grounded in the observed board state."
          - "The answer includes a board follow-up with a concrete next step that is grounded in the observed board state, including when the board appears empty or sparse."
          - "The answer does not claim to have created, edited, saved, or modified any content."
        passThreshold: 1
        contextFrom: "trace.turns"
        judge:
          profile: "default"

execution:
  timeoutMs: 120000
  retryOnError: 0
  trialsPerTask: 3
  maxConcurrency: 2
