schemaVersion: "task.v1"
id: "file-edit-agent/smoke/create-hello-001"
desc: "Agent must create a new file with specific content using write_file."
category: "file-edit-agent"
capability: "file-create"
tier: "L0"
difficulty: "easy"
tags: ["smoke", "file-create", "outcome"]

provider:
  id: "file-edit-agent"
  runs:
    - name: "gpt-4o-mini"
      params:
        model: "gpt-4o-mini"
        task: "Create a file called hello.txt with the content: Hello, Agent!"
        outcomePaths:
          - "hello.txt"
    - name: "gpt-5-mini"
      params:
        model: "gpt-5-mini"
        task: "Create a file called hello.txt with the content: Hello, Agent!"
        outcomePaths:
          - "hello.txt"
    - name: "gpt-5-nano"
      params:
        model: "gpt-5-nano"
        task: "Create a file called hello.txt with the content: Hello, Agent!"
        outcomePaths:
          - "hello.txt"

graders:
  strategy: "ALL"
  layers:
    - name: "hello.txt must exist with correct content"
      type: "outcome-check"
      config:
        expect:
          "hello.txt": "Hello, Agent!"

    - name: "must call write_file"
      type: "tool-calls"
      config:
        required:
          - tool: "write_file"

execution:
  timeoutMs: 60000
  retryOnError: 0
  trialsPerTask: 2
  maxConcurrency: 2
