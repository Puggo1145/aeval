schemaVersion: "task.v1"
id: "file-edit-agent/smoke/modify-greeting-002"
desc: "Agent must read an existing file, replace a word, and write it back."
category: "file-edit-agent"
capability: "file-modify"
tier: "L1"
difficulty: "easy"
tags: ["smoke", "file-modify", "read-before-write", "outcome"]

provider:
  id: "file-edit-agent"
  runs:
    - name: "gpt-4o-mini"
      params:
        model: "gpt-4o-mini"
        task: "In greeting.txt, replace the word 'World' with 'Agent'. Do not change anything else."
        setup:
          "greeting.txt": "Hello World"
        outcomePaths:
          - "greeting.txt"
    - name: "gpt-5-mini"
      params:
        model: "gpt-5-mini"
        task: "In greeting.txt, replace the word 'World' with 'Agent'. Do not change anything else."
        setup:
          "greeting.txt": "Hello World"
        outcomePaths:
          - "greeting.txt"
    - name: "gpt-5-nano"
      params:
        model: "gpt-5-nano"
        task: "In greeting.txt, replace the word 'World' with 'Agent'. Do not change anything else."
        setup:
          "greeting.txt": "Hello World"
        outcomePaths:
          - "greeting.txt"

graders:
  strategy: "ALL"
  layers:
    - name: "greeting.txt content must be updated"
      type: "outcome-check"
      config:
        expect:
          "greeting.txt": "Hello Agent"

    - name: "must read file before writing"
      type: "tool-calls"
      config:
        required:
          - tool: "read_file"
          - tool: "write_file"

    - name: "agent loop must be multi-turn (read + write = at least 2 tool steps)"
      type: "transcript"
      config:
        minTurns: 4

execution:
  timeoutMs: 60000
  retryOnError: 0
  trialsPerTask: 2
  maxConcurrency: 2
